{% block content %}

<!-- ==================== CONTACT ==================== -->
<div class="position-relative">

    <img src="/media/blue.jpg"
         alt="Blood donation"
         class="img-fluid w-100"
         style="height: 55vh; object-fit: cover;">

    <div class="position-absolute"
         style="left: 8%;
                top: 50%;
                transform: translateY(-50%);
                max-width: 650px;">

        <h5 style="color: #C50000 ; letter-spacing: 1px;">

            </span>

    </div>
